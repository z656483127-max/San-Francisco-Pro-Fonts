<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S. Mk. XXII - AMBER PROTOCOL</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    
    <!-- AI & UI Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <style>
        /* --- AESTHETICS (ORANGE THEME) --- */
        :root {
            --arc-blue: #ffaa00; /* Amber Orange */
            --arc-glow: #ffcc00; /* Bright Yellow-Orange */
            --alert-red: #ff3300; /* Deep Red for alerts */
            --glass-bg: rgba(20, 10, 0, 0.7);
            --font-main: 'Segoe UI', 'Roboto Condensed', sans-serif;
        }

        body {
            margin: 0; padding: 0;
            background-color: #000;
            color: var(--arc-blue);
            font-family: var(--font-main);
            overflow: hidden;
            height: 100vh; width: 100vw;
            user-select: none;
        }

        /* --- LAYERS --- */
        #cam-feed {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            object-fit: cover; transform: scaleX(-1);
            z-index: 1; opacity: 1;
            filter: contrast(1.4) brightness(0.5) sepia(1) hue-rotate(-10deg) saturate(2);
        }

        #hand-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 999; transform: scaleX(-1); pointer-events: none;
        }

        #vignette {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: radial-gradient(circle at center, transparent 40%, #000 120%);
            z-index: 2; pointer-events: none;
        }

        #ui-layer {
            position: relative; z-index: 10; width: 100%; height: 100%;
            pointer-events: none;
            perspective: 1200px;
        }

        /* --- HUD WIDGETS --- */
        .top-bar {
            position: absolute; top: 30px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 40px; align-items: center;
        }
        .hud-tag {
            font-size: 10px; letter-spacing: 3px; color: var(--arc-glow);
            border-bottom: 2px solid var(--arc-blue); padding-bottom: 2px;
            text-shadow: 0 0 10px var(--arc-blue);
        }

        .left-panel {
            position: absolute; left: 50px; top: 15%;
            transform: rotateY(15deg);
            display: flex; flex-direction: column; gap: 15px;
            width: 220px;
        }
        .bar-frame { width: 100%; height: 4px; background: rgba(255, 100, 0, 0.2); }
        .bar-fill { height: 100%; background: var(--arc-blue); width: 0%; transition: width 0.5s; box-shadow: 0 0 8px var(--arc-blue); }
        .bar-fill.active { width: 92%; animation: pulseBar 2s infinite; }
        .label-text { font-size: 9px; color: var(--arc-blue); letter-spacing: 1px; font-weight: bold; }
        .box-container { border: 1px solid var(--arc-blue); padding: 10px; background: var(--glass-bg); backdrop-filter: blur(5px); pointer-events: auto; }

        .weather-val { font-size: 18px; color: #fff; font-weight: bold; text-shadow: 0 0 10px var(--arc-glow); }
        .weather-sub { font-size: 10px; color: var(--arc-blue); opacity: 0.8; }

        #hex-dump {
            font-family: monospace; font-size: 8px; color: rgba(255, 170, 0, 0.7);
            line-height: 1.2; margin-top: 5px; height: 30px; overflow: hidden;
        }

        /* --- RIGHT PANEL --- */
        .right-panel {
            position: absolute; right: 60px; top: 15%;
            width: 380px;
            transform: rotateY(-15deg);
            display: flex; flex-direction: column; gap: 20px;
            pointer-events: auto;
        }

        #radar-housing {
            width: 380px; height: 380px;
            border-radius: 50%;
            border: 2px solid var(--arc-blue);
            position: relative; overflow: hidden;
            background: rgba(20, 10, 0, 0.9);
            box-shadow: 0 0 30px rgba(255, 170, 0, 0.3);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        #ai-intelligence-box {
            background: var(--glass-bg);
            border: 1px solid var(--arc-glow);
            padding: 15px;
            font-size: 11px;
            max-height: 250px;
            overflow-y: auto;
            color: #fff;
            box-shadow: 0 0 15px rgba(255, 170, 0, 0.2);
        }

        .gemini-btn {
            background: rgba(255, 170, 0, 0.1);
            border: 1px solid var(--arc-blue);
            color: var(--arc-blue);
            padding: 8px;
            width: 100%;
            cursor: pointer;
            font-size: 10px;
            letter-spacing: 1px;
            margin-bottom: 10px;
            transition: all 0.3s;
        }
        .gemini-btn:hover { background: var(--arc-blue); color: #000; }

        #map-layer { width: 100%; height: 100%; opacity: 0; transition: opacity 1s; }
        #map-layer.active { opacity: 1; }
        #map { width: 100%; height: 100%; background: #000; }

        .leaflet-layer {
            filter: grayscale(100%) sepia(100%) hue-rotate(-10deg) saturate(350%) contrast(1.1) brightness(0.9);
            opacity: 0.9; 
        }
        .leaflet-layer.true-color { filter: none !important; opacity: 1; }

        #radar-sweep {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: conic-gradient(from 0deg, transparent 70%, rgba(255, 170, 0, 0.1) 90%, rgba(255, 200, 0, 0.6) 100%);
            border-radius: 50%; animation: spin 4s linear infinite;
            pointer-events: none; mix-blend-mode: screen; z-index: 10;
        }

        .bottom-console {
            position: absolute; bottom: 40px; left: 50px;
            width: 400px; transform: rotateX(20deg);
        }
        #log-feed {
            font-family: 'Consolas', monospace; font-size: 10px; color: rgba(255, 170, 0, 0.6);
            height: 120px; overflow: hidden; display: flex; flex-direction: column-reverse;
            text-shadow: 0 0 2px var(--arc-blue);
        }
        .msg-sys { color: var(--arc-glow); } 
        .msg-usr { color: #fff; border-left: 2px solid var(--arc-glow); padding-left: 5px; margin: 2px 0; }
        .msg-jarvis { color: var(--arc-blue); font-weight: bold; }

        #hand-cursor {
            position: absolute; width: 40px; height: 40px;
            border: 2px solid var(--arc-glow); border-radius: 50%;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 2001;
            display: none; box-shadow: 0 0 20px var(--arc-glow);
        }
        #hand-cursor.drag { border-color: var(--alert-red); width: 20px; height: 20px; background: rgba(255, 50, 0, 0.3); }

        #boot-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            transition: opacity 1s;
        }
        .boot-btn {
            background: transparent; color: var(--arc-blue);
            border: 2px solid var(--arc-blue); padding: 20px 60px;
            font-size: 18px; letter-spacing: 5px; text-transform: uppercase;
            cursor: pointer; box-shadow: 0 0 30px rgba(255, 170, 0, 0.3);
        }

        /* --- LOADER --- */
        .scanning-line {
            position: absolute; top: 0; left: 0; width: 100%; height: 2px;
            background: var(--arc-glow); box-shadow: 0 0 15px var(--arc-glow);
            animation: scanMove 3s infinite; z-index: 100; display: none;
        }
        @keyframes scanMove { 0% { top: 0% } 100% { top: 100% } }

        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes pulseBar { 0%, 100% { opacity: 0.6; } 50% { opacity: 1; box-shadow: 0 0 15px var(--arc-glow); } }
    </style>
</head>
<body>

<video id="cam-feed" playsinline autoplay muted></video>
<canvas id="hand-canvas"></canvas>
<div id="vignette"></div>
<div id="hand-cursor"></div>
<div id="global-scanner" class="scanning-line"></div>

<div id="boot-screen">
    <button class="boot-btn" id="start-btn" onclick="systemBoot()">INITIALIZE J.A.R.V.I.S.</button>
    <div id="boot-log" style="margin-top:20px; font-size:12px; color:var(--arc-blue); display:none; text-align:center;">
        UPLOADING AMBER CORE...
    </div>
</div>

<div id="ui-layer">
    <div class="top-bar">
        <div class="hud-tag">MK. XXII</div>
        <div class="hud-tag" id="sys-clock">00:00:00</div>
        <div class="hud-tag">AI CORE: <span id="voice-status" style="color:var(--alert-red)">OFFLINE</span></div>
    </div>

    <div class="left-panel">
        <div class="box-container">
            <div class="label-text">ARC REACTOR</div>
            <div class="bar-frame" style="margin-top:5px;"><div class="bar-fill active" style="width:92%"></div></div>
        </div>
        
        <div class="box-container">
            <div class="label-text">GESTURE CONTROL</div>
            <div id="hand-log" style="font-size:11px; color:#fff; margin-top:5px;">STANDBY</div>
        </div>

        <div class="box-container" onclick="triggerScan()">
            <div class="label-text" style="display:flex; justify-content:space-between;">
                <span>DIAGNOSTICS</span>
                <span id="diag-status" style="color:var(--arc-glow)">ACTIVE</span>
            </div>
            <div id="hex-dump"></div>
        </div>

        <div class="box-container">
            <div class="label-text">ATMOSPHERIC</div>
            <div id="weather-box" style="margin-top:5px; opacity: 0.5;">
                <div id="weather-display" class="weather-val">--°</div>
                <div id="weather-desc" class="weather-sub">WAITING...</div>
            </div>
        </div>
    </div>

    <div class="right-panel" id="radar-panel">
        <div id="radar-housing">
            <div id="radar-sweep"></div>
            <div id="map-layer">
                <div id="map"></div>
            </div>
        </div>

        <div id="ai-intelligence-box" class="box-container">
            <div class="label-text" style="margin-bottom:10px; color:var(--arc-glow)">✨ STRATEGIC INTEL</div>
            <button class="gemini-btn" onclick="generateTacticalBriefing()">✨ GENERATE TACTICAL BRIEFING</button>
            <div id="ai-brief-content" style="opacity:0.8; font-family: monospace; line-height:1.4;">
                Awaiting mission parameters...
            </div>
        </div>
    </div>

    <div class="bottom-console">
        <div class="label-text" style="border-bottom:1px solid var(--arc-blue); margin-bottom:5px; padding-bottom:2px;">COMMS LINK</div>
        <div id="log-feed">
            <div>[SYS] CORE READY.</div>
        </div>
    </div>
</div>

<script>
    // --- GLOBAL STATE ---
    const STATE = {
        booted: false,
        fullscreen: false,
        speaking: false,
        isListening: false,
        map: null,
        currentTemp: "Unknown",
        currentWeather: "Clear",
        recognition: null,
        apiKey: "" // API Key provided by system
    };

    const WMO_CODES = { 0: "Clear Sky", 1: "Mainly Clear", 2: "Cloudy", 3: "Overcast", 45: "Fog", 61: "Rain", 95: "Storm" };

    // --- GEMINI API INTEGRATION ---
    async function callGeminiAI(prompt, type = "voice") {
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${STATE.apiKey}`;
        
        let systemPrompt = "You are J.A.R.V.I.S., Tony Stark's AI. Amber Protocol is active (tactical orange UI). ";
        if(type === "voice") {
            systemPrompt += "Keep responses very brief, dryly witty, and professional. Max 2 sentences.";
        } else {
            systemPrompt += "Provide a tactical assessment. Use bullet points. Be concise.";
        }

        const payload = {
            contents: [{ parts: [{ text: prompt }] }],
            systemInstruction: { parts: [{ text: systemPrompt }] }
        };

        try {
            const response = await fetch(endpoint, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            return data.candidates?.[0]?.content?.parts?.[0]?.text || "Communication relay failed.";
        } catch (err) {
            return "AI Core offline. Local fail-safe engaged.";
        }
    }

    // --- ✨ FEATURE: TACTICAL BRIEFING ---
    async function generateTacticalBriefing() {
        if(!STATE.booted) return;
        const briefBox = document.getElementById('ai-brief-content');
        briefBox.innerHTML = "<span style='color:var(--arc-glow)'>ACCESSING SATELLITE ARRAYS...</span>";
        
        const loc = STATE.map.getCenter();
        const prompt = `Current Location: ${loc.lat}, ${loc.lng}. Weather: ${STATE.currentTemp}, ${STATE.currentWeather}. System Status: All systems nominal. Generate a tactical summary for this location.`;
        
        const response = await callGeminiAI(prompt, "brief");
        briefBox.innerText = response;
        speak("Tactical analysis updated, sir. I've highlighted potential points of interest.");
    }

    // --- SYSTEM CORE ---
    async function systemBoot() {
        if(STATE.booted) return;
        
        document.getElementById('start-btn').style.display = 'none';
        document.getElementById('boot-log').style.display = 'block';

        sysLog("INIT OPTICAL SENSORS...", "SYS");
        await startCamera();
        
        sysLog("LINKING NEURAL NET...", "SYS");
        await initHands();

        initMap();
        initClock();
        startStatusSim();
        initSpeechRecognition(); // New robust init

        setTimeout(() => {
            document.getElementById('boot-screen').style.opacity = '0';
            setTimeout(() => document.getElementById('boot-screen').remove(), 1000);
            
            STATE.booted = true;
            document.getElementById('map-layer').classList.add('active');
            
            speak("Amber Protocol initiated. System online and ready, sir.");
            sysLog("HUD ACTIVE", "SYS");
            
            setTimeout(() => { if(STATE.map) STATE.map.invalidateSize(); }, 800);
            checkWeather();
        }, 1500);
    }

    // --- TACTICAL MAP ---
    function initMap() {
        STATE.map = L.map('map', { zoomControl: false, attributionControl: false, center: [34.0195, -118.4912], zoom: 13 });
        L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
            maxZoom: 19
        }).addTo(STATE.map);
    }

    async function checkWeather() {
        const center = STATE.map.getCenter();
        try {
            const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${center.lat}&longitude=${center.lng}&current_weather=true`);
            const data = await res.json();
            if(data.current_weather) {
                const {temperature: t, weathercode: c} = data.current_weather;
                STATE.currentTemp = `${t}°C`;
                STATE.currentWeather = WMO_CODES[c] || "Stable";
                document.getElementById('weather-box').style.opacity = '1';
                document.getElementById('weather-display').innerText = STATE.currentTemp;
                document.getElementById('weather-desc').innerText = STATE.currentWeather.toUpperCase();
            }
        } catch(e) { sysLog("SAT LINK FAILURE", "ERR"); }
    }

    // --- ROBUST VOICE ENGINE ---
    function initSpeechRecognition() {
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(!SR) return;
        
        STATE.recognition = new SR();
        STATE.recognition.continuous = false;
        STATE.recognition.interimResults = false;
        STATE.recognition.lang = 'en-US';

        STATE.recognition.onstart = () => {
            STATE.isListening = true;
            const v = document.getElementById('voice-status');
            v.innerText = "LISTENING"; v.style.color = "var(--arc-glow)";
        };

        STATE.recognition.onend = () => {
            STATE.isListening = false;
            document.getElementById('voice-status').innerText = "STANDBY";
            document.getElementById('voice-status').style.color = "var(--alert-red)";
            // Auto-restart if not speaking
            if (STATE.booted && !STATE.speaking) {
                setTimeout(safeStartRecognition, 300);
            }
        };

        STATE.recognition.onresult = (event) => {
            const cmd = event.results[0][0].transcript.toLowerCase();
            processCommand(cmd);
        };
    }

    function safeStartRecognition() {
        if (!STATE.recognition || STATE.isListening || STATE.speaking) return;
        try {
            STATE.recognition.start();
        } catch(e) {
            console.warn("Recognition start failed: already running or blocked.");
        }
    }

    async function processCommand(cmd) {
        sysLog(cmd.toUpperCase(), "USR");

        if(cmd.includes('maximize') || cmd.includes('full screen')) {
            document.getElementById('radar-panel').style.width = "100%";
            speak("Maximizing tactical display.");
            return;
        }
        
        if(cmd.includes('scan') || cmd.includes('diagnostics')) {
            triggerScan();
            speak("Running global diagnostics. Integrity at 98%.");
            return;
        }

        // AI Generic Response
        const aiResponse = await callGeminiAI(cmd);
        speak(aiResponse);
    }

    function speak(text) {
        if(!window.speechSynthesis) return;
        
        // Stop recognition while speaking to prevent self-triggering
        if (STATE.recognition) {
            try { STATE.recognition.stop(); } catch(e){}
        }
        
        STATE.speaking = true;
        const u = new SpeechSynthesisUtterance(text);
        u.lang = 'en-US'; u.pitch = 0.9; u.rate = 1.0;
        
        u.onend = () => { 
            STATE.speaking = false; 
            if (STATE.booted) safeStartRecognition(); 
        };
        
        window.speechSynthesis.speak(u);
        sysLog(text, "JARVIS");
    }

    // --- VISION ENGINE ---
    let videoElement, canvasElement, canvasCtx, hands;
    let lastHandX=0, lastHandY=0;

    async function startCamera() {
        videoElement = document.getElementById('cam-feed');
        const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 1280, height: 720 } });
        videoElement.srcObject = stream;
        return new Promise(r => videoElement.onloadedmetadata = r);
    }

    async function initHands() {
        canvasElement = document.getElementById('hand-canvas');
        canvasCtx = canvasElement.getContext('2d');
        canvasElement.width = window.innerWidth;
        canvasElement.height = window.innerHeight;

        hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        hands.onResults(onHandResults);

        const detect = async () => {
            await hands.send({image: videoElement});
            requestAnimationFrame(detect);
        };
        detect();
    }

    function onHandResults(results) {
        canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);
        const cursor = document.getElementById('hand-cursor');
        
        if (results.multiHandLandmarks?.length > 0) {
            document.getElementById('hand-log').innerText = "TRACKING";
            cursor.style.display = 'block';
            
            const lm = results.multiHandLandmarks[0];
            const index = lm[8];
            const thumb = lm[4];
            const x = (1 - index.x) * window.innerWidth;
            const y = index.y * window.innerHeight;
            
            cursor.style.left = x + 'px';
            cursor.style.top = y + 'px';

            const dist = Math.hypot(index.x - thumb.x, index.y - thumb.y);
            if (dist < 0.05) {
                cursor.className = 'drag';
                if(STATE.map) {
                    const dx = x - lastHandX;
                    const dy = y - lastHandY;
                    STATE.map.panBy([-dx, -dy], {animate: false});
                }
            } else { cursor.className = ''; }
            
            lastHandX = x; lastHandY = y;
        } else {
            cursor.style.display = 'none';
            document.getElementById('hand-log').innerText = "SCANNING...";
        }
    }

    // --- UI SIMULATION ---
    function triggerScan() {
        const scanner = document.getElementById('global-scanner');
        scanner.style.display = 'block';
        document.getElementById('diag-status').innerText = "SCANNING";
        setTimeout(() => {
            scanner.style.display = 'none';
            document.getElementById('diag-status').innerText = "ACTIVE";
        }, 3000);
    }

    function startStatusSim() {
        const hex = document.getElementById('hex-dump');
        setInterval(() => {
            const code = Math.random().toString(16).substring(2, 10).toUpperCase();
            hex.innerText = `0x${code} :: SYNC_LATENCY_0.4ms\n` + hex.innerText.substring(0, 80);
        }, 400);
    }

    function initClock() {
        setInterval(() => {
            document.getElementById('sys-clock').innerText = new Date().toLocaleTimeString('en-US', {hour12:false});
        }, 1000);
    }

    function sysLog(msg, type) {
        const feed = document.getElementById('log-feed');
        const line = document.createElement('div');
        line.className = `msg-${type.toLowerCase()}`;
        line.innerText = `[${type}] ${msg}`;
        feed.prepend(line);
        if(feed.children.length > 8) feed.lastChild.remove();
    }
</script>
</body>
</html>
